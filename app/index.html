<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cazorla Planning 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   CAZORLA PLANNING 2026 — Design System v5
   Font: DM Sans (geometric, modern, friendly)
   Theme: Dark forest + warm accents
   ═══════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap');

:root {
  --bg: #f7f7f5;
  --bg2: #efeeeb;
  --card: #ffffff;
  --bdr: #e8e6e1;
  --bdr2: #d9d6cf;
  --tx: #1a1814;
  --tx2: #6b6560;
  --tx3: #9c9690;

  /* Forest palette */
  --forest: #1a3a2a;
  --forest-l: #e8f5ee;
  --forest-d: #0f1a13;
  --mint: #2ea055;
  --mint-l: #d1f5df;

  /* Accents */
  --blue: #2563eb;
  --amber: #d97706;
  --red: #dc2626;
  --purple: #7c3aed;

  /* Sizing */
  --r: 12px;
  --r-sm: 8px;
  --r-lg: 16px;
  --sh: 0 1px 2px rgba(0,0,0,.04), 0 1px 5px rgba(0,0,0,.03);
  --sh-md: 0 4px 16px rgba(0,0,0,.06);
  --sh-lg: 0 12px 40px rgba(0,0,0,.1);
  --transition: .15s cubic-bezier(.4,0,.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0 }
html { scroll-behavior: smooth }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer }
input, select, textarea { font-family: inherit }

/* ═══ ANIMATIONS ═══ */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{transform:translateY(100%)}to{transform:translateY(0)} }
@keyframes slideDown { from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1} }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
@keyframes spin { to{transform:rotate(360deg)} }

/* ═══ LOGIN ═══ */
.login-wrap {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--forest-d);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(46,160,85,.12) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(37,99,235,.06) 0%, transparent 50%);
  padding: 20px;
}
.login-card {
  background: var(--card);
  border-radius: 24px;
  padding: 44px 32px 36px;
  max-width: 360px;
  width: 100%;
  box-shadow: var(--sh-lg), 0 0 0 1px rgba(255,255,255,.05);
  text-align: center;
  animation: fadeIn .4s ease;
}
.login-icon { font-size: 48px; display: block; margin-bottom: 4px }
.login-card h1 { font-size: 22px; font-weight: 800; color: var(--forest); margin-bottom: 2px }
.login-card p { font-size: 12px; color: var(--tx3); margin-bottom: 24px }
.login-input {
  width: 100%; padding: 14px 16px;
  border: 2px solid var(--bdr); border-radius: 14px;
  font-size: 16px; outline: none;
  text-align: center; letter-spacing: 3px;
  transition: var(--transition);
  background: var(--bg);
}
.login-input:focus { border-color: var(--mint); background: #fff; box-shadow: 0 0 0 4px rgba(46,160,85,.08) }
.login-btn {
  width: 100%; padding: 14px;
  border: none; border-radius: 14px;
  background: var(--forest);
  color: #fff; font-size: 15px; font-weight: 700;
  margin-top: 14px; transition: var(--transition);
}
.login-btn:hover { background: var(--mint) }
.login-btn:active { transform: scale(.98) }
.login-err { color: var(--red); font-size: 11px; margin-top: 10px; font-weight: 600 }

/* ═══ SHELL (top + sidebar placeholder) ═══ */
.shell { display: flex; flex-direction: column; min-height: 100dvh }

/* ═══ TOPBAR ═══ */
.top {
  background: var(--forest-d);
  padding: 0 16px;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.top-in {
  display: flex; align-items: center;
  height: 54px; gap: 8px;
  max-width: 1400px; margin: 0 auto;
}
.logo {
  font-weight: 800; font-size: 16px;
  color: #fff; display: flex; align-items: center; gap: 6px;
  flex-shrink: 0; letter-spacing: -.3px;
}
.logo-leaf { font-size: 22px }
.logo small { font-size: 10px; font-weight: 500; opacity: .4; margin-left: 2px }
.top-r { display: flex; align-items: center; gap: 5px; margin-left: auto }

/* Status */
.sync-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 600;
  transition: var(--transition);
}
.sync-saved { background: rgba(46,160,85,.15); color: #5eead4 }
.sync-unsaved { background: rgba(251,191,36,.15); color: #fbbf24 }
.sync-saving { background: rgba(96,165,250,.15); color: #93c5fd }
.sync-err { background: rgba(248,113,113,.15); color: #f87171 }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.sync-saving .sync-dot { animation: pulse 1s infinite }

.ro-badge {
  background: rgba(251,191,36,.12); color: #fbbf24;
  font-size: 9px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
}

/* Icon button (top bar) */
.ti {
  width: 34px; height: 34px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; background: rgba(255,255,255,.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(255,255,255,.7);
  transition: var(--transition); flex-shrink: 0;
}
.ti:hover { background: rgba(255,255,255,.1); color: #fff }
.ti.on { background: var(--mint); color: #fff; border-color: var(--mint) }
/* Text button (top bar) */
.tt {
  padding: 6px 14px; border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; background: rgba(255,255,255,.06);
  font-size: 11px; font-weight: 600; color: #fff;
  display: inline-flex; align-items: center; gap: 4px;
  transition: var(--transition); white-space: nowrap;
}
.tt:hover { background: rgba(255,255,255,.12) }
.tt-g { background: var(--mint); border-color: var(--mint) }
.tt-g:hover { background: #25944b }

/* ═══ FILTER BAR ═══ */
.fbar {
  background: var(--card);
  border-bottom: 1px solid var(--bdr);
  padding: 8px 16px;
  position: sticky; top: 54px; z-index: 90;
}
.fbar-in {
  display: flex; align-items: center; gap: 6px;
  max-width: 1400px; margin: 0 auto; flex-wrap: wrap;
}
.tabs {
  display: inline-flex;
  background: var(--bg2); border-radius: var(--r-sm);
  padding: 3px; gap: 2px;
}
.tab {
  padding: 5px 12px; border: none;
  border-radius: 6px; background: transparent;
  font-size: 11px; font-weight: 600;
  color: var(--tx3); transition: var(--transition);
}
.tab:hover { color: var(--tx) }
.tab.on { background: var(--card); color: var(--tx); box-shadow: 0 1px 3px rgba(0,0,0,.06) }
.search-box {
  position: relative; flex-shrink: 0;
}
.search-box input {
  padding: 6px 10px 6px 30px;
  border: 1px solid var(--bdr); border-radius: var(--r-sm);
  font-size: 11px; outline: none; width: 130px;
  transition: var(--transition); background: var(--bg);
}
.search-box input:focus { border-color: var(--mint); width: 170px; background: #fff; box-shadow: 0 0 0 3px rgba(46,160,85,.06) }
.search-box::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 11px }
.spacer { flex: 1 }

/* ═══ SAVE BAR (new!) ═══ */
.save-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: #fffbeb; border-bottom: 1px solid #fde68a;
  animation: slideDown .2s ease;
  max-width: 1400px; margin: 0 auto; width: 100%;
}
.save-bar-wrap { background: #fffbeb; border-bottom: 1px solid #fde68a; position: sticky; top: 90px; z-index: 89 }
.save-bar span { font-size: 11px; font-weight: 600; color: #92400e; flex: 1 }
.save-btn {
  padding: 6px 16px; border: none; border-radius: 8px;
  font-size: 11px; font-weight: 700; transition: var(--transition);
}
.save-btn-ok { background: var(--mint); color: #fff }
.save-btn-ok:hover { background: #259050 }
.save-btn-undo { background: #fff; color: #92400e; border: 1px solid #fde68a }
.save-btn-undo:hover { background: #fef3c7 }

/* ═══ MAIN CONTENT ═══ */
.main { max-width: 1400px; margin: 0 auto; padding: 16px }

/* KPIs */
.kpis { display: flex; gap: 8px; margin-bottom: 14px }
.kpi {
  background: var(--card); border: 1px solid var(--bdr);
  border-radius: var(--r); padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--sh); animation: fadeIn .3s ease;
}
.kpi-icon { font-size: 20px }
.kpi-val { font-size: 22px; font-weight: 800; color: var(--forest); line-height: 1 }
.kpi-lbl { font-size: 9px; color: var(--tx3); font-weight: 500; text-transform: uppercase; letter-spacing: .5px }

/* Nav (week/month) */
.nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px }
.nav h2 { font-size: 14px; font-weight: 700; flex: 1 }
.nav-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--bdr); border-radius: var(--r-sm);
  background: var(--card); font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.nav-btn:hover { background: var(--forest-l); border-color: var(--mint) }

/* ═══ PLANNING GRID ═══ */
.wk-wrap {
  display: block; width: 100%;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}
.wk {
  display: grid; gap: 1px;
  background: var(--bdr2);
  border-radius: var(--r); overflow: hidden;
  box-shadow: var(--sh-md);
  width: max-content; min-width: 100%;
}
.wk-corner {
  background: var(--forest-d); padding: 6px;
  display: flex; align-items: flex-end; justify-content: center;
}
.wk-corner span { color: rgba(255,255,255,.3); font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px }
.wk-dh {
  background: var(--forest-d); color: #fff;
  padding: 6px 2px; text-align: center;
}
.wk-dh.we { background: #1f2e27 }
.wk-dh .d-day { font-size: 7px; opacity: .5; text-transform: uppercase; letter-spacing: .5px; font-weight: 600 }
.wk-dh .d-num { font-size: 18px; font-weight: 800; line-height: 1.1 }
.wk-dh .d-mon { font-size: 7px; opacity: .25 }

/* School name cell */
.wk-name {
  background: var(--card); padding: 5px 6px;
  display: flex; flex-direction: column; justify-content: center;
  cursor: pointer; border-right: 3px solid var(--mint);
  transition: var(--transition); min-width: 0;
}
.wk-name:hover { background: var(--forest-l) }
.wk-name .n { font-weight: 700; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wk-name .s { font-size: 7px; color: var(--tx3) }
.wk-name .info { font-size: 7px; line-height: 1.3; margin-top: 1px }
.wk-name .info-m { color: var(--blue) }
.wk-name .info-n { color: var(--amber) }

/* Day cells */
.wk-cell {
  background: var(--card); padding: 2px;
  min-height: 50px; display: flex; flex-direction: column; gap: 1px;
  transition: background var(--transition);
}
.wk-cell.off { background: var(--bg) }
.wk-cell.drop { background: var(--mint-l); box-shadow: inset 0 0 0 2px var(--mint) }

/* ═══ ACTIVITY CHIP ═══ */
.chip-w {
  display: flex; border-radius: 5px; overflow: hidden;
  transition: transform .08s, box-shadow .08s;
}
.chip-w:hover { box-shadow: 0 2px 6px rgba(0,0,0,.12); transform: translateY(-1px); z-index: 2 }
.chip {
  display: flex; align-items: center; gap: 2px;
  padding: 3px 5px; font-size: 9px; font-weight: 600;
  color: #fff; cursor: grab; flex: 1;
  min-height: 20px; line-height: 1.2; user-select: none;
}
.chip-icon { font-style: normal; font-size: 10px; flex-shrink: 0 }
.chip-time {
  font-size: 7px; background: rgba(255,255,255,.2);
  padding: 0 3px; border-radius: 3px;
  font-weight: 700; flex-shrink: 0;
}
.chip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0 }
.chip-mons { font-size: 7px; opacity: .8; flex-shrink: 0; max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip-arrows { display: flex; flex-direction: column; opacity: 0; transition: opacity .08s }
.chip-w:hover .chip-arrows { opacity: 1 }
.chip-mv {
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 6px; color: #fff; padding: 0 4px;
  flex: 1; background: rgba(0,0,0,.08); transition: background .08s;
}
.chip-mv:hover { background: rgba(0,0,0,.2) }
.chip-mv:disabled { opacity: .15; cursor: default }
.chip-x {
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; color: #fff; padding: 0 5px;
  opacity: 0; background: rgba(0,0,0,.08); transition: .08s;
}
.chip-w:hover .chip-x { opacity: 1 }
.chip-x:hover { background: rgba(220,38,38,.4) }

.add-slot {
  border: 1px dashed var(--bdr2); border-radius: 4px;
  padding: 1px; text-align: center;
  font-size: 8px; color: var(--tx3); cursor: pointer;
  transition: var(--transition);
}
.add-slot:hover { border-color: var(--mint); color: var(--mint); background: var(--forest-l) }

/* ═══ CARDS LIST (collapsed) ═══ */
.cards { display: flex; flex-direction: column; gap: 6px }
.card-row {
  background: var(--card); border: 1px solid var(--bdr);
  border-radius: var(--r); padding: 14px 16px;
  cursor: pointer; display: flex; align-items: center; gap: 12px;
  transition: var(--transition); animation: fadeIn .25s ease;
}
.card-row:hover { border-color: var(--bdr2); box-shadow: var(--sh-md) }
.card-row:active { transform: scale(.995) }
.card-dot { width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0 }
.card-row h3 { font-size: 14px; font-weight: 700; margin: 0 }
.card-row .sub { font-size: 11px; color: var(--tx2); margin-top: 1px }
.card-arrow { color: var(--tx3); font-size: 18px; flex-shrink: 0; transition: transform .2s }

/* ═══ CARD DETAIL (fullscreen) ═══ */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg); overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
.detail-head {
  position: sticky; top: 0; z-index: 10;
  background: var(--forest-d); color: #fff;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.detail-head h2 { font-size: 16px; font-weight: 800; flex: 1; margin: 0 }
.detail-head .sub { font-size: 10px; opacity: .6 }
.detail-close {
  width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,.15); border-radius: 10px;
  background: rgba(255,255,255,.06); cursor: pointer;
  font-size: 16px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.detail-close:hover { background: rgba(255,255,255,.12) }

.detail-meta {
  padding: 14px 16px; background: var(--card);
  border-bottom: 1px solid var(--bdr);
}
.detail-meta p { font-size: 12px; color: var(--tx2); line-height: 1.7 }
.detail-meta .meta-blue { color: var(--blue) }
.detail-meta .meta-amber { color: var(--amber) }
.detail-meta-btns { display: flex; gap: 6px; margin-top: 8px }

/* Day block */
.day-block { margin: 0 16px 20px }
.day-header {
  position: sticky; top: 56px; z-index: 5;
  background: var(--bg); padding: 12px 0 8px;
  display: flex; align-items: baseline; gap: 8px;
}
.day-num { font-size: 32px; font-weight: 800; color: var(--forest); line-height: 1 }
.day-name {
  font-size: 12px; font-weight: 600; color: var(--tx3);
  text-transform: uppercase; letter-spacing: .8px;
}

/* Activity row in detail */
.act-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; background: var(--card);
  border: 1px solid var(--bdr); border-radius: var(--r);
  margin-bottom: 5px; transition: var(--transition);
  cursor: pointer;
}
.act-row:hover { border-color: var(--bdr2); box-shadow: var(--sh) }
.act-row:active { background: var(--bg) }
.act-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #fff; flex-shrink: 0;
}
.act-body { flex: 1; min-width: 0 }
.act-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px }
.act-time {
  font-size: 10px; background: var(--bg2);
  padding: 1px 7px; border-radius: 5px;
  font-weight: 700; color: var(--tx2); flex-shrink: 0;
}
.act-mons { font-size: 11px; color: var(--blue); margin-top: 2px }
.act-btns {
  display: flex; gap: 4px; flex-shrink: 0; align-self: center;
  opacity: 0; transition: opacity .1s;
}
.act-row:hover .act-btns { opacity: 1 }
.act-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--bdr); border-radius: 7px;
  background: var(--card); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; transition: var(--transition);
}
.act-btn:hover { background: var(--forest-l); border-color: var(--mint) }
.act-btn.del:hover { background: #fef2f2; border-color: var(--red) }
.act-btn:disabled { opacity: .15 }

.add-act-btn {
  border: 1px dashed var(--bdr2); border-radius: var(--r-sm);
  padding: 6px; text-align: center;
  font-size: 11px; font-weight: 500; color: var(--tx3);
  cursor: pointer; transition: var(--transition);
  margin-top: 2px;
}
.add-act-btn:hover { border-color: var(--mint); color: var(--mint); background: var(--forest-l) }

/* ═══ MONTH ═══ */
.month-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 1px; background: var(--bdr2);
  border-radius: var(--r); overflow: hidden;
  box-shadow: var(--sh-md);
}
.month-hdr {
  background: var(--forest-d); color: #fff;
  padding: 5px; text-align: center;
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px;
}
.month-cell { background: var(--card); padding: 3px; min-height: 58px }
.month-cell.empty { background: var(--bg) }
.month-d { font-size: 10px; font-weight: 700; color: var(--tx3); margin-bottom: 1px }
.month-bar {
  padding: 1px 4px; border-radius: 3px;
  font-size: 7px; font-weight: 700; color: #fff;
  cursor: pointer; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; margin-bottom: 1px;
  transition: filter .08s;
}
.month-bar:hover { filter: brightness(1.12) }

/* ═══ MODALS ═══ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(15,26,19,.4);
  z-index: 300; display: flex;
  align-items: center; justify-content: center;
  padding: 12px; backdrop-filter: blur(4px);
}
.modal {
  background: var(--card);
  border-radius: 20px; width: 100%;
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--sh-lg), 0 0 0 1px rgba(0,0,0,.03);
  animation: fadeIn .2s ease;
}
.modal-head {
  padding: 16px 18px;
  border-bottom: 1px solid var(--bdr);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: var(--card);
  z-index: 1; border-radius: 20px 20px 0 0;
}
.modal-head h3 { font-size: 16px; font-weight: 700 }
.modal-x {
  width: 32px; height: 32px; border: none;
  background: var(--bg2); border-radius: 10px;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.modal-x:hover { background: var(--bdr) }
.modal-body { padding: 16px 18px }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--bdr);
  display: flex; gap: 6px; flex-wrap: wrap;
}

/* Form fields */
.field { margin-bottom: 10px }
.field label {

}

  border-color: var(--mint);

}
.field input[readonly], .field textarea[readonly] { background: var(--bg); color: var(--tx3) }
textarea { resize: vertical; min-height: 48px }

/* Generic buttons */
.btn {
  padding: 6px 14px; border: 1px solid var(--bdr);
  border-radius: 10px; background: var(--card);
  font-size: 11px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 4px;
  transition: var(--transition); color: var(--tx);

.btn-red { color: var(--red); border-color: #fecaca }
.btn-red:hover { background: #fef2f2 }

/* Picker */
.pick-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  gap: 4px; margin-bottom: 8px;
}
.pick-item {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 8px; border-radius: 10px;
  cursor: pointer; border: 1.5px solid var(--bdr);

.pick-dot {

.fab {

/* ═══ MOBILE TOPBAR ═══ */
.hide-mobile { display: flex }

function gpdf(g,showMons){
  const sd=par(g.startDate),ed=par(g.endDate);
  const nd=Math.round((ed-sd)/864e5)+1;
  const days=Array.from({length:nd},(_,i)=>({date:addD(sd,i),str:fmt(addD(sd,i))}));
  const d=document.createElement('div');
  d.className='pdf-print-area';
  let ht=`<h2>🌿 ${g.name}</h2><div class="pdf-meta">`;
  ht+=`📍 ${g.origin} · 🏨 ${g.hotel} · 👥 ${g.numKids||'?'} alumnos · 👨‍🏫 ${g.numTeachers||'?'} profes<br>`;
  ht+=`📅 ${sd.getDate()} ${MN[sd.getMonth()]} – ${ed.getDate()} ${MN[ed.getMonth()]} 2026`;
  if(g.transport)ht+=`<br>🚌 ${g.transport}`;
  if(g.monitors)ht+=`<br><span style="color:#1864ab">👤 Monitores: ${g.monitors}</span>`;
  if(g.notes)ht+=`<br><span style="color:#d97706">📝 ${g.notes}</span>`;
  ht+=`</div>`;
  days.forEach(x=>{
    ht+=`<div class="pdf-day-title">${DNF[x.date.getDay()]} ${x.date.getDate()} de ${MN[x.date.getMonth()]}</div>`;
    const acts=g.activities[x.str]||[];
    acts.forEach(a=>{const c=CM[a.type];if(!c)return;
      ht+=`<div class="pdf-act"><div class="pdf-dot" style="background:${c.c}"></div><div>`;
      ht+=`<div class="pdf-act-name">${c.i} ${a.label}${a.time?' <span class="pdf-act-time">'+a.time+'</span>':''}</div>`;
      if(showMons&&a.monitors)ht+=`<div class="pdf-act-mons">👤 ${a.monitors}</div>`;
      if(a.obs)ht+=`<div class="pdf-act-obs">📝 ${a.obs}</div>`;
      ht+=`</div></div>`;
    });
  });
  d.innerHTML=ht;document.body.appendChild(d);
  html2canvas(d,{scale:2,backgroundColor:'#fff'}).then(c=>{
    const{jsPDF:J}=window.jspdf;
    // A4 vertical: 210x297mm
    const pw=210,ph=297,margin=10;
    const imgW=pw-margin*2,imgH=c.height*(imgW/c.width);
    const pdf=new J({orientation:'p',unit:'mm',format:'a4'});
    let y=margin;
    if(imgH<=ph-margin*2){pdf.addImage(c.toDataURL('image/png'),'PNG',margin,y,imgW,imgH)}
    else{
      // Multi-page
      const pageH=ph-margin*2;
      const totalPages=Math.ceil(imgH/pageH);
      for(let p=0;p<totalPages;p++){
        if(p>0)pdf.addPage();
        const srcY=p*pageH*(c.width/imgW);
        const srcH=Math.min(pageH*(c.width/imgW),c.height-srcY);
        const canvas2=document.createElement('canvas');
        canvas2.width=c.width;canvas2.height=srcH;
        const ctx=canvas2.getContext('2d');
        ctx.drawImage(c,0,srcY,c.width,srcH,0,0,c.width,srcH);
        const drawH=srcH*(imgW/c.width);
        pdf.addImage(canvas2.toDataURL('image/png'),'PNG',margin,margin,imgW,drawH);
      }
    }
    pdf.save(g.name+'.pdf');document.body.removeChild(d);
  });
}

function exportJSON(G){
  const blob=new Blob([JSON.stringify(G,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='cazorla_planning_'+fmt(new Date())+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importJSON(file,onLoad){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw new Error('No es un array');onLoad(d)}catch(e){alert('Archivo inválido: '+e.message)}};
  r.readAsText(file);
}
